<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f5f7">
  <title>Погода &bull; Open-Meteo</title>
  <style>
    :root {
      --bg: #f4f5f7; --text: #1f2937; --card: #ffffff; --border: #e5e7eb;
      --primary: #3b82f6; --success: #10b981; --warning: #f59e0b;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }
    [data-theme="dark"] {
      --bg: #111827; --text: #f9fafb; --card: #1f2937; --border: #374151;
      --primary: #3b82f6; --success: #10b981; --warning: #f59e0b;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 50px; transition: background 0.3s, color 0.3s; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    .container {
      width: 100%;
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Шапка */
    header { 
      background: var(--card); 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      padding: 12px 20px; 
      position: sticky; 
      top: 15px; 
      z-index: 100; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      box-shadow: var(--shadow); 
    }
    .logo { font-size: 1.25rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
    
    .btn { 
      background: var(--primary); 
      color: #fff; 
      border: none; 
      padding: 8px 14px; 
      border-radius: 8px; 
      font-weight: 600; 
      cursor: pointer; 
      text-decoration: none; 
      font-size: 14px; 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      gap: 6px; 
      transition: opacity 0.2s, background 0.2s; 
    }
    .btn:hover { opacity: 0.9; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }

    /* Карточки */
    .card { 
      background: var(--card); 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      padding: 20px; 
      box-shadow: var(--shadow); 
    }
    .card h2 { margin-bottom: 15px; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; color: var(--text); }

    /* Блок 1: Главная инфо */
    .block1-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; align-items: center; }
    @media (max-width: 600px) { .block1-grid { grid-template-columns: 1fr; } }
    
    .current-temp-box { display: flex; flex-direction: column; gap: 4px; }
    .temp-large { font-size: 3rem; font-weight: 800; line-height: 1; color: var(--primary); }
    .temp-feels { font-size: 0.95rem; color: #6b7280; font-weight: 500; }
    
    .current-status-box { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
    .status-item { display: flex; justify-content: space-between; align-items: center; }
    .status-label { color: #6b7280; }
    .status-val { font-weight: 600; }

    /* Почасовой прогноз (как у Яндекса - с горизонтальной прокруткой) */
    .hourly-scroll-container {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .hourly-scroll-container::-webkit-scrollbar { height: 6px; }
    .hourly-scroll-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .hour-card {
      min-width: 80px;
      flex: 0 0 auto;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.2s;
    }
    .hour-card.now { border-color: var(--primary); background: rgba(59, 130, 246, 0.05); }
    .hour-time { font-size: 13px; font-weight: 600; color: #6b7280; }
    .hour-icon { font-size: 20px; }
    .hour-temp { font-size: 16px; font-weight: 700; }
    .hour-details { font-size: 11px; color: #6b7280; display: flex; flex-direction: column; gap: 2px; }

    /* Блок 2: Детали (сетка) */
    .details-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
    .detail-cell { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
    .detail-title { font-size: 12px; color: #6b7280; font-weight: 500; }
    .detail-value { font-size: 15px; font-weight: 700; }

    /* Блок 3: Астрономия */
    .astro-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (max-width: 650px) { .astro-grid { grid-template-columns: 1fr; } }
    .astro-cell { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 6px; text-align: center; }
    .astro-title { font-size: 13px; color: #6b7280; }
    .astro-val { font-size: 16px; font-weight: 700; }

    /* Футер */
    footer { text-align: center; font-size: 12px; color: #6b7280; margin-top: 10px; line-height: 1.5; padding: 0 10px; }
    
    .loading { text-align: center; padding: 40px; color: #6b7280; font-weight: 500; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Шапка -->
    <header>
      <div class="logo">☁️ Погода</div>
      <a href="index.html" class="btn btn-outline">
        <span>⬅️</span> Назад
      </a>
    </header>

    <main style="display: flex; flex-direction: column; gap: 20px;" id="main-content">
      <div class="loading" id="loading-state">Загрузка данных прогноза...</div>
    </main>

    <!-- Футер -->
    <footer>
      Данные берутся из Open-Meteo, возможны неточности. Используются глобальные модели, сами по себе довольно точные.<br>
      Эта страница не собирает данные о пользователях в отличие от сайтов прогнозов погоды.
    </footer>
  </div>

  <script>
    // Тема
    const theme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);

    // Координаты по умолчанию (например, Москва / можно заменить или подключить геолокацию)
    let lat = 55.75;
    let lon = 37.61;

    async function fetchWeather() {
      try {
        // Запрос к Open-Meteo со всеми необходимыми параметрами
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,dew_point_2m&hourly=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,snow_depth,dew_point_2m&daily=sunrise,sunset,daylight_duration,uv_index_max,moon_phase&timezone=auto`;
        
        const res = await fetch(url);
        if (!res.ok) throw new Error('Ошибка сети');
        const data = await res.json();

        renderWeather(data);
      } catch (err) {
        document.getElementById('loading-state').innerText = 'Не удалось загрузить данные погоды. Проверьте интернет-соединение.';
      }
    }

    // Расшифровка WMO кодов погоды в иконку и текст
    fnWeatherMeta = (code) => {
      const map = {
        0: { icon: '☀️', text: 'Ясно' },
        1: { icon: '🌤️', text: 'Преимущественно ясно' },
        2: { icon: '⛅', text: 'Переменная облачность' },
        3: { icon: '☁️', text: 'Пасмурно' },
        45, 48: { icon: '🌫️', text: 'Туман' },
        51, 53, 55: { icon: '🌧️', text: 'Морось' },
        61, 63: { icon: '🌧️', text: 'Дождь' },
        65: { icon: '🌧️', text: 'Сильный дождь' },
        71, 73, 75, 77: { icon: '❄️', text: 'Снег' },
        80, 81, 82: { icon: '🌦️', text: 'Ливень' },
        85, 86: { icon: '🌨️', text: 'Снежный заряд' },
        95, 96, 99: { icon: '⚡', text: 'Гроза' }
      };
      return map[code] || { icon: '🌡️', text: 'Облачно' };
    };

    function getMoonPhaseText(phase) {
      if (phase === 0 || phase === 1) return 'Новолуние';
      if (phase > 0 && phase < 0.25) return 'Растущая луна';
      if (phase === 0.25) return 'Первая четверть';
      if (phase > 0.25 && phase < 0.5) return 'Растущая выпуклая';
      if (phase === 0.5) return 'Полнолуние';
      if (phase > 0.5 && phase < 0.75) return 'Убывающая выпуклая';
      if (phase === 0.75) return 'Последняя четверть';
      return 'Убывающая луна';
    }

    function formatWindDirection(deg) {
      if (deg === undefined) return '';
      const dirs = ['С', 'СВ', 'В', 'ЮВ', 'Ю', 'ЮЗ', 'З', 'СЗ'];
      return dirs[Math.round(deg / 45) % 8];
    }

    function renderWeather(data) {
      const current = data.current;
      const hourly = data.hourly;
      const daily = data.daily;

      // Текущий час индекс
      const nowIso = current.time.slice(0, 13);
      let currentIndex = hourly.time.findIndex(t => t.slice(0, 13) === nowIso);
      if (currentIndex === -1) currentIndex = 0;

      // Анализ осадков (когда будут / когда закончатся)
      let precipStatusText = "Без осадков в ближайшее время";
      let startPrecip = null;
      let endPrecip = null;
      
      for (let i = currentIndex; i < Math.min(hourly.time.length, currentIndex + 24); i++) {
        if (hourly.precipitation[i] > 0 || hourly.precipitation_probability[i] > 50) {
          if (!startPrecip) startPrecip = new Date(hourly.time[i]).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        } else if (startPrecip && !endPrecip) {
          endPrecip = new Date(hourly.time[i]).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          break;
        }
      }

      if (startPrecip) {
        precipStatusText = `Осадки начнется в ${startPrecip}` + (endPrecip ? `, закончатся в ${endPrecip}` : '');
      } else if (current.precipitation > 0) {
        precipStatusText = "Осадки идут сейчас";
      }

      const currentWeatherMeta = fnWeatherMeta(current.weather_code);

      // Генерация карточек по часам (±12 часов)
      let hourlyCardsHTML = '';
      const startIdx = Math.max(0, currentIndex - 12);
      const endIdx = Math.min(hourly.time.length, currentIndex + 13);

      for (let i = startIdx; i < endIdx; i++) {
        const hTime = new Date(hourly.time[i]).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const hMeta = fnWeatherMeta(hourly.weather_code[i]);
        const isNow = i === currentIndex;
        
        hourlyCardsHTML += `
          <div class="hour-card ${isNow ? 'now' : ''}">
            <div class="hour-time">${isNow ? 'Сейчас' : hTime}</div>
            <div class="hour-icon" title="${hMeta.text}">${hMeta.icon}</div>
            <div class="hour-temp">${Math.round(hourly.temperature_2m[i])}°</div>
            <div class="hour-details">
              <span>☁️ ${hourly.cloud_cover[i]}%</span>
              <span>💧 ${hourly.precipitation_probability[i] || 0}%</span>
            </div>
          </div>
        `;
      }

      // Сборка HTML страницы
      const mainContainer = document.getElementById('main-content');
      mainContainer.innerHTML = `
        <!-- Блок 1: Основные данные -->
        <div class="card">
          <h2>${currentWeatherMeta.icon} Текущая погода &bull; ${currentWeatherMeta.text}</h2>
          <div class="block1-grid">
            <div class="current-temp-box">
              <div class="temp-large">${Math.round(current.temperature_2m)}°C</div>
              <div class="temp-feels">Ощущается как ${Math.round(current.apparent_temperature)}°C</div>
            </div>
            <div class="current-status-box">
              <div class="status-item">
                <span class="status-label">Облачность</span>
                <span class="status-val">${current.cloud_cover}%</span>
              </div>
              <div class="status-item">
                <span class="status-label">Прогноз осадков</span>
                <span class="status-val" style="font-size: 13px; text-align: right;">${precipStatusText}</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Почасовой прогноз -->
        <div class="card">
          <h2>⏰ Погода по часам (±12 часов)</h2>
          <div class="hourly-scroll-container">
            ${hourlyCardsHTML}
          </div>
        </div>

        <!-- Блок 2: Параметры -->
        <div class="card">
          <h2>📊 Метеорологические параметры</h2>
          <div class="details-grid">
            <div class="detail-cell">
              <span class="detail-title">Ветер</span>
              <span class="detail-value">${current.wind_speed_10m} м/с, ${formatWindDirection(current.wind_direction_10m)}</span>
            </div>
            <div class="detail-cell">
              <span class="detail-title">Давление</span>
              <span class="detail-value">${Math.round(current.pressure_msl * 0.750062)} мм рт. ст.</span>
            </div>
            <div class="detail-cell">
              <span class="detail-title">Влажность</span>
              <span class="detail-value">${current.relative_humidity_2m}%</span>
            </div>
            <div class="detail-cell">
              <span class="detail-title">Точка росы</span>
              <span class="detail-value">${current.dew_point_2m}°C</span>
            </div>
            <div class="detail-cell">
              <span class="detail-title">Снежный покров</span>
              <span class="detail-value">${(hourly.snow_depth[currentIndex] || 0) * 100} см</span>
            </div>
            <div class="detail-cell">
              <span class="detail-title">Облачность</span>
              <span class="detail-value">${current.cloud_cover}%</span>
            </div>
            <div class="detail-cell">
              <span class="detail-title">УФ-индекс</span>
              <span class="detail-value">${daily.uv_index_max[0] || 0}</span>
            </div>
          </div>
        </div>

        <!-- Блок 3: Солнце и луна -->
        <div class="card">
          <h2>☀️ Астрономия и световой день</h2>
          <div class="astro-grid">
            <div class="astro-cell">
              <span class="astro-title">Восход и заход</span>
              <span class="astro-val">🌅 ${new Date(daily.sunrise[0]).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} / 🌇 ${new Date(daily.sunset[0]).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
            </div>
            <div class="astro-cell">
              <span class="astro-title">Фаза луны</span>
              <span class="astro-val">🌙 ${getMoonPhaseText(daily.moon_phase[0])}</span>
            </div>
            <div class="astro-cell">
              <span class="astro-title">Световой день</span>
              <span class="astro-val">⏳ ${(daily.daylight_duration[0] / 3600).toFixed(1)} ч.</span>
            </div>
          </div>
        </div>
      `;
    }

    // Инициализация при загрузке
    fetchWeather();
  </script>
</body>
</html>
